name: family-integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-coinstall:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record tested parent revision
        run: |
          mkdir -p family-validation
          git rev-parse HEAD > family-validation/parent-revision.txt
          cp compatibility.toml family-validation/compatibility.toml
      - name: Validate compatibility manifest
        run: python3 scripts/check_compatibility.py
      - name: Load public compatibility revisions
        id: compatibility
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("compatibility.toml").read_text())
          for name in ("itamae", "sashimi-c", "sashimi-si", "sashimi-w"):
              entry = manifest[name]
              key = name.replace("-", "_")
              print(f"{key}_repo={entry['repo']}")
              print(f"{key}_ref={entry['ref']}")
          PY
      - name: Check out pinned public ITAMAE
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.compatibility.outputs.itamae_repo }}
          ref: ${{ steps.compatibility.outputs.itamae_ref }}
          path: .itamae
      - name: Check out pinned public SASHIMI-C
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.compatibility.outputs.sashimi_c_repo }}
          ref: ${{ steps.compatibility.outputs.sashimi_c_ref }}
          path: .sashimi-c
      - name: Check out pinned public SASHIMI-SI
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.compatibility.outputs.sashimi_si_repo }}
          ref: ${{ steps.compatibility.outputs.sashimi_si_ref }}
          path: .sashimi-si
      - name: Check out pinned public SASHIMI-W
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.compatibility.outputs.sashimi_w_repo }}
          ref: ${{ steps.compatibility.outputs.sashimi_w_ref }}
          path: .sashimi-w
      - name: Verify checked out compatibility revisions
        env:
          ITAMAE_REF: ${{ steps.compatibility.outputs.itamae_ref }}
          SASHIMI_C_REF: ${{ steps.compatibility.outputs.sashimi_c_ref }}
          SASHIMI_SI_REF: ${{ steps.compatibility.outputs.sashimi_si_ref }}
          SASHIMI_W_REF: ${{ steps.compatibility.outputs.sashimi_w_ref }}
        run: |
          test "$(git -C .itamae rev-parse HEAD)" = "$ITAMAE_REF"
          test "$(git -C .sashimi-c rev-parse HEAD)" = "$SASHIMI_C_REF"
          test "$(git -C .sashimi-si rev-parse HEAD)" = "$SASHIMI_SI_REF"
          test "$(git -C .sashimi-w rev-parse HEAD)" = "$SASHIMI_W_REF"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create clean family environment
        run: uv venv --python "${{ matrix.python-version }}" .venv-family
      - name: Build ITAMAE and all SASHIMI wheels
        run: |
          uv build --out-dir dist-family ./.itamae
          uv build --out-dir dist-family ./.sashimi-c
          uv build --out-dir dist-family ./.sashimi-si
          uv build --out-dir dist-family ./.sashimi-w
      - name: Verify embedded artifact source revisions
        run: >-
          python3 scripts/check_artifact_provenance.py
          --directory dist-family
          --manifest compatibility.toml
          --require-sdist
          --packages itamae sashimi-c sashimi-si sashimi-w
      - name: Install public ITAMAE and SASHIMI variants
        run: uv pip install --python .venv-family/bin/python dist-family/*.whl
      - name: Verify independent reference workflow boundaries
        run: .venv-family/bin/python -m unittest discover -s tests
      - name: Verify standard APIs and physical quantities outside source
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.venv-family/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_family.py" \
            --manifest "$GITHUB_WORKSPACE/compatibility.toml" \
            --output "$GITHUB_WORKSPACE/family-validation/original-smoke" \
            --packages itamae sashimi-c sashimi-si sashimi-w
      - name: Rebuild source archives without revision injection
        run: |
          .venv-family/bin/python - <<'PYCODE'
          import pathlib, subprocess, sys, tomllib
          manifest = tomllib.loads(pathlib.Path("compatibility.toml").read_text())
          for package in ("itamae", "sashimi-c", "sashimi-si", "sashimi-w"):
              name = "sashimi_itamae" if package == "itamae" else package.replace("-", "_")
              archive, = pathlib.Path("dist-family").glob(name + "-*.tar.gz")
              subprocess.run([sys.executable, "scripts/check_sdist_rebuild.py", "--package", package,
                              "--archive", str(archive), "--expected-revision", manifest[package]["ref"],
                              "--output", "family-validation/rebuilt/" + package], check=True)
          PYCODE
          uv venv --python "${{ matrix.python-version }}" .venv-rebuilt
          uv pip install --python .venv-rebuilt/bin/python family-validation/rebuilt/*/*.whl
      - name: Verify rebuilt artifacts outside source
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.venv-rebuilt/bin/python" -I \
            "$GITHUB_WORKSPACE/scripts/smoke_installed_family.py" \
            --manifest "$GITHUB_WORKSPACE/compatibility.toml" \
            --output "$GITHUB_WORKSPACE/family-validation/rebuilt-smoke" \
            --packages itamae sashimi-c sashimi-si sashimi-w
      - name: Record artifact hashes
        run: sha256sum dist-family/*.whl dist-family/*.tar.gz > family-validation/artifact-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-family-validation-${{ matrix.python-version }}
          path: family-validation/
