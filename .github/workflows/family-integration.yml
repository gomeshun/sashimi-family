name: family-integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Full also runs shipped regressions and rebuilt-wheel smoke on every Python
        type: choice
        options: [full, standard]
        default: full

permissions:
  contents: read
  actions: read

concurrency:
  group: family-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  public-coinstall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate compatibility manifest
        run: python3 scripts/check_compatibility.py
      - uses: ./.github/actions/changed-paths
        id: changes
        with:
          paths: |
            .github/workflows/family-integration.yml
            .github/actions/**
            .gitmodules
            compatibility.toml
            itamae
            sashimi-c
            sashimi-si
            sashimi-w
            sashimi-f
            scripts/**
            tests/**
      - name: Record tested parent and public revisions
        if: steps.changes.outputs.changed == 'true'
        id: compatibility
        run: |
          mkdir -p family-validation
          git rev-parse HEAD > family-validation/parent-revision.txt
          cp compatibility.toml family-validation/compatibility.toml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path("compatibility.toml").read_text())
          for name in ("itamae", "sashimi-c", "sashimi-si", "sashimi-w"):
              entry = manifest[name]
              key = name.replace("-", "_")
              print(f"{key}_repo={entry['repo']}")
              print(f"{key}_ref={entry['ref']}")
          PY
      - uses: actions/checkout@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          repository: ${{ steps.compatibility.outputs.itamae_repo }}
          ref: ${{ steps.compatibility.outputs.itamae_ref }}
          path: itamae
      - uses: actions/checkout@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          repository: ${{ steps.compatibility.outputs.sashimi_c_repo }}
          ref: ${{ steps.compatibility.outputs.sashimi_c_ref }}
          path: sashimi-c
      - uses: actions/checkout@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          repository: ${{ steps.compatibility.outputs.sashimi_si_repo }}
          ref: ${{ steps.compatibility.outputs.sashimi_si_ref }}
          path: sashimi-si
      - uses: actions/checkout@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          repository: ${{ steps.compatibility.outputs.sashimi_w_repo }}
          ref: ${{ steps.compatibility.outputs.sashimi_w_ref }}
          path: sashimi-w
      - uses: astral-sh/setup-uv@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          python-version: '3.11'
      - name: Build once and validate the same artifacts on Python 3.11–3.13
        if: steps.changes.outputs.changed == 'true'
        env:
          FAMILY_PROFILE: ${{ inputs.profile || 'standard' }}
        run: |
          python scripts/validate_family_artifacts.py \
            --manifest compatibility.toml --source-root "$GITHUB_WORKSPACE" \
            --output family-validation/artifacts --profile "$FAMILY_PROFILE" \
            --packages itamae sashimi-c sashimi-si sashimi-w --workflow-tests
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.changed == 'true'
        with:
          name: public-family-validation
          path: family-validation/
          if-no-files-found: error
